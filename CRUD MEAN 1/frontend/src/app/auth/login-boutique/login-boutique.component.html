<div class="account-login section">
  <div class="container">
    <div class="row">
      <div class="col-lg-6 offset-lg-3 col-md-10 offset-md-1 col-12">

        <!-- FORMULAIRE LOGIN BOUTIQUE -->
        <form
          class="card login-form"
          (ngSubmit)="onLoginBoutique()"
          #loginForm="ngForm"
        >
          <div class="card-body">

            <div class="title text-center">
              <h3>Login Boutique</h3>
              <p>Accès réservé aux boutiques du centre commercial</p>
            </div>

            <!-- EMAIL -->
            <div class="form-group input-group">
              <label>Email</label>
              <input
                class="form-control"
                type="email"
                name="email"
                [(ngModel)]="email"
                required
                placeholder="Email"
              />
            </div>

            <!-- PASSWORD -->
            <div class="form-group input-group">
              <label>Mot de passe</label>
              <input
                class="form-control"
                type="password"
                name="password"
                [(ngModel)]="password"
                required
                placeholder="Mot de passe"
              />
            </div>

            <!-- ERREUR -->
            <p *ngIf="error" class="text-danger text-center">
              {{ error }}
            </p>

            <!-- BOUTON LOGIN -->
            <div class="button text-center">
              <button
                class="btn"
                type="submit"
                [disabled]="loginForm.invalid"
              >
                Se connecter
              </button>
            </div>

            <!-- SWITCH CLIENT -->
            <div class="text-center mt-3">
              <button
                type="button"
                class="btn btn-alt"
                (click)="switchToClient()"
              >
                Se connecter en tant que Client
              </button>
            </div>

          </div>
        </form>
        <!-- FIN FORM -->

      </div>
    </div>
  </div>
</div>
