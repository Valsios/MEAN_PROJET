<div class="account-login section">
  <div class="container">
    
   
    <div class="row">
      <div class="col-lg-6 offset-lg-3 col-md-10 offset-md-1 col-12">

        <!-- FORMULAIRE LOGIN CLIENT -->
        <form
          class="card login-form"
          (ngSubmit)="onLoginClient()"
          #loginForm="ngForm"
        >
          <div class="card-body">

            <!-- Logo -->
    <div class="text-center mb-4">
      <a href="/">
        <img src="assets/images/logo/logo.svg" alt="Logo Centre Commercial" style="max-height: 60px;">
      </a>
    </div>

            <div class="title text-center">
              <h3>Login Client</h3>
              <p>Accès réservé aux Clients du centre commercial</p>
            </div>

            <!-- EMAIL -->
            <div class="form-group input-group">
              <label>Email</label>
              <input
                class="form-control"
                type="email"
                name="email"
                [(ngModel)]="email"
                required
                placeholder="Email"
                
              />
            </div>

            <!-- PASSWORD -->
            <div class="form-group input-group">
              <label>Mot de passe</label>
              <input
                class="form-control"
                type="password"
                name="password"
                [(ngModel)]="password"
                required
                placeholder="Mot de passe"
              />
            </div>

            <!-- ERREUR -->
            <p *ngIf="error" class="text-danger text-center">
              {{ error }}
            </p>

            <!-- BOUTON LOGIN -->
            <div class="button text-center">
              <button
                class="btn"
                type="submit"
                [disabled]="loginForm.invalid"
              >
                Se connecter
              </button>
            </div>

            <!-- LIEN INSCRIPTION -->
            <div class="text-center mt-3">
              <p>Pas encore de compte ? 
                <a href="javascript:void(0)" (click)="goToRegister()" class="register-link">
                  S'inscrire
                </a>
              </p>
            </div>

            <!-- LIENS DE REDIRECTION -->
            <div class="text-center mt-4">
              <div class="mb-2">
                <a href="javascript:void(0)" (click)="goToAdminLogin()" class="text-primary">
                  <i class="lni lni-shield"></i> Se connecter en tant qu'Admin
                </a>
              </div>
              <div>
                <a href="javascript:void(0)" (click)="goToBoutiqueLogin()" class="text-primary">
                  <i class="lni lni-store"></i> Se connecter en tant que Boutique
                </a>
              </div>
            </div>

          </div>
        </form>
        <!-- FIN FORM -->

      </div>
    </div>
  </div>
</div>
