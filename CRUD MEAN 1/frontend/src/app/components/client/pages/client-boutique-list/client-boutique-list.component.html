<div class="container">
  <div class="row mb-4">
    <div class="col-12">
      <h1 class="mt-3">Nos Boutiques</h1>
      <p class="text-muted">Découvrez toutes les boutiques du centre commercial</p>
    </div>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Chargement...</span>
    </div>
  </div>

  <!-- Error -->
  <div *ngIf="error" class="alert alert-danger text-center">
    {{ error }}
  </div>

  <!-- Liste des boutiques -->
  <div *ngIf="!loading && !error" class="row">
    <div *ngFor="let boutique of boutiques" class="col-lg-4 col-md-6 col-12 mb-4">
      <div class="card h-100 shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <h5 class="card-title mb-0">{{ boutique.nom }}</h5>
            <span class="badge bg-info">{{ getCategorieName(boutique) }}</span>
          </div>
          
          <div class="mb-3">
            <p class="card-text mb-1">
              <i class="lni lni-envelope me-2"></i>{{ boutique.email }}
            </p>
            <p class="card-text mb-1">
              <i class="lni lni-phone me-2"></i>{{ boutique.telephone }}
            </p>
            <p class="card-text mb-1">
              <i class="lni lni-map-marker me-2"></i>{{ getBoxInfo(boutique) }}
            </p>
          </div>

          <div class="d-grid">
            <button 
              class="btn btn-outline-danger" 
              (click)="reportBoutique(boutique._id)"
            >
              <i class="lni lni-flag me-2"></i>Signaler un problème
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Message si aucune boutique -->
    <div *ngIf="boutiques.length === 0" class="col-12 text-center py-5">
      <p class="text-muted">Aucune boutique disponible pour le moment.</p>
    </div>
  </div>
</div>
