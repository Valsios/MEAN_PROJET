
<app-boutique-header></app-boutique-header>
<!-- ===================== FILTRE ET BOUTON SUR LA MEME LIGNE ===================== -->
<section class="search-section py-3">
  <div class="container">
    <div class="row align-items-center">
      <!-- Barre de recherche (à gauche) -->
      <div class="col-md-8">
        <div class="input-group">
          <span class="input-group-text bg-white">
            <i class="lni lni-search"></i>
          </span>
          <input 
            type="text" 
            class="form-control" 
            placeholder="Rechercher un produit par nom..."
            [(ngModel)]="searchTerm"
            (ngModelChange)="filtrerProduits()">
          <span class="input-group-text bg-white" *ngIf="searchTerm" style="cursor: pointer;" (click)="resetFiltre()">
            <i class="lni lni-close text-danger"></i>
          </span>
        </div>
      </div>
      
      <!-- Bouton Ajouter (à droite) -->
      <div class="col-md-4 text-end">
        <button class="btn btn-primary" (click)="produitForm()">
          <i class="lni lni-plus"></i> Ajouter un produit
        </button>
      </div>
    </div>
    
    <!-- Indicateur de résultats (optionnel) -->
    <div class="row" *ngIf="searchTerm">
      <div class="col-12">
        <small class="text-muted">
          {{produits.length}} produit(s) trouvé(s)
        </small>
      </div>
    </div>
  </div>
</section>
<!-- ===================== MAIN CONTENT ===================== -->
<section class="section" style="min-height: 60vh;">
  <div class="container">
    <div class="row">

      <!-- Boucle sur les produits -->
      <div class="col-lg-4 col-md-6 col-12" *ngFor="let produit of produits">
        <!-- Start Single Product -->
        <div class="single-product">
          <div class="product-image">
            <!-- si produit.image contient le binaire en base64 -->
            <img *ngIf="produit.image" [src]="'data:image/png;base64,' + produit.image" alt="{{produit.nom}}">
            <!-- sinon image par défaut -->
            <img *ngIf="!produit.image" src="assets/images/products/No_Image_Available.jpg" alt="{{produit.nom}}">
            
            <div class="button">
              <a (click)="detailsProduit(produit._id)" class="btn"><i class="lni lni-eye"></i> Details</a>
            </div>
          </div>

          <div class="product-info">
            <span class="category">{{produit.type}}</span>
            <h4 class="title">
              <p>{{produit.nom}}</p>
            </h4>
            <ul class="review">
              <li *ngFor="let star of [1,2,3,4,5]"><i class="lni lni-star-filled"></i></li>
              <li><span>5.0 Review(s)</span></li>
            </ul>
            <div class="price">
              <span>{{produit.prixActuel | currency:'MGA':'symbol':'1.0-0'}}</span>
            </div>

            <div class="delete-button">
                <button class="btn btn-danger btn-sm" 
                        [attr.id]="'delete-product-' + produit._id"
                        (click)="deleteProduct(produit._id)">
                <i class="lni lni-trash"></i> Supprimer
                </button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- ===================== END MAIN CONTENT ===================== -->
<app-boutique-footer></app-boutique-footer>
